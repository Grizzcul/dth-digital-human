<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 让页面在手机和电脑上都按实际屏幕宽度显示。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的数字人</title>
  <!-- HTML 定义结构；这两行分别连接另外两个文件。 -->
  <link rel="stylesheet" href="style.css">
  <script src="speech.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- 中央卡片只包含数字人和输入框，展开记录不会改变它的布局。 -->
  <main class="card">
    <header>
      <!-- 单角色名称由脚本填写；更换外观只需替换 png 下的固定素材。 -->
      <p class="eyebrow" id="assistant-name"></p>
      <h1>你好，我在这里。</h1>
      <p class="introduction">输入一句话，我们开始聊聊吧。</p>
    </header>

    <div class="interaction-layout">
      <section class="assistant-main" aria-label="数字人和输入">
        <div class="stage">
          <p class="status"><span class="status-dot"></span><span id="status-text">待机中</span></p>
          <!-- 通用角色容器：既可以展示静态图片，也可以播放动作视频。 -->
          <div class="avatar" id="avatar">
            <!-- 素材地址由 JS 配置填写；初始隐藏，不加载任何旧角色的视频。 -->
            <!-- 不写 loop：JavaScript 会在每次播放后随机等待一会儿。 -->
            <video class="avatar-media" id="avatar-video"
              muted playsinline preload="none" hidden
              aria-label="数字人的动作动画"></video>
            <!-- 没有视频的角色显示图片；视频失败时也改为显示这张配套图片。 -->
            <img class="avatar-media" id="avatar-fallback"
              alt="数字人角色图片" hidden>
          </div>
        </div>

        <p class="asset-message" id="asset-message" role="status"></p>

        <section class="reply-panel" aria-label="当前回答">
          <p class="reply-label">当前回答</p>
          <p class="reply-text" id="reply-text" aria-live="off"></p>
          <div class="spoken-caption" id="spoken-caption" hidden>
            <span>朗读字幕</span>
            <p id="spoken-text" aria-live="off"></p>
          </div>
        </section>

        <form class="composer" id="chat-form">
          <!-- 开发测试使用本机预设问答和音频，未命中也不调用云端。 -->
          <div class="test-controls">
            <label><input id="test-toggle" type="checkbox" disabled>开发测试模式（不调用云端）</label>
          </div>
          <details class="test-tools">
            <summary>测试句与音频缓存</summary>
            <div id="test-case-buttons" class="test-case-buttons"></div>
            <button id="cache-check" type="button" class="speech-button">检查测试音频</button>
            <button id="cache-prepare" type="button" class="speech-button" hidden>生成缺失音频</button>
            <button id="cache-cancel" type="button" class="speech-button" hidden>停止准备</button>
            <p id="cache-status" role="status">正在读取测试句…</p>
          </details>
          <!-- 【新增：模型开关】不写 checked，所以每次打开页面默认不调用模型。 -->
          <div class="model-controls">
            <label class="model-toggle">
              <input id="model-toggle" type="checkbox" role="switch">
              <span class="switch-track" aria-hidden="true"></span>
              <span>模型回答</span>
            </label>
          </div>
          <div class="speech-controls" aria-label="语音播报设置">
            <label class="speech-toggle"><input id="speech-toggle" type="checkbox" disabled>语音播报</label>
            <!-- 音色在 tts.py 固定，网页不再列出电脑合成音。 -->
            <span class="voice-label" id="speech-voice-name">魅力女友 2.0</span>
            <button id="speech-preview" type="button" class="speech-button">试听</button>
            <button id="speech-stop" type="button" class="speech-button" hidden>停止朗读</button>
          </div>
          <p class="speech-status" id="speech-status" role="status"></p>
          <p class="speech-status" id="reply-source" role="status"></p>
          <!-- 耗时只在事件发生时更新，不做定时请求；展开后可判断哪里在等。 -->
          <details class="latency-panel">
            <summary>本轮响应耗时</summary>
            <p id="latency-values">发送消息或点击试听后显示。</p>
          </details>
          <label class="input-label" for="message-input">你想说什么？</label>
          <div class="input-row">
            <!-- 【可以试着改 2】placeholder 是提示；maxlength 限制字数。 -->
            <input id="message-input" type="text" placeholder="今天有什么要分享的？" maxlength="500" autocomplete="off">
            <!-- id 让 JS 在等待 Python 回复时禁用发送按钮，避免重复请求。 -->
            <button id="send-button" type="submit">发送</button>
            <button id="stop-button" class="stop-button" type="button" hidden>停止回答</button>
          </div>
        </form>
        <p class="hint">Enter 发送 · 开启语音可边生成边朗读 · 右侧查看完整记录</p>
        <!-- 正常时为空；连接失败时在输入框下方提示，抽屉收起也能看到。 -->
        <p class="connection-message" id="connection-message" role="status"></p>
      </section>
    </div>
  </main>

  <!-- 【修改：页面边缘抽屉】箭头和面板移到了 main 外面，与中央卡片平级。 -->
  <!-- CSS 的 position: fixed 把它们固定在浏览器内容区域的右边缘。 -->
  <!-- type="button" 表示箭头只负责切换，不发送消息。 -->
  <button class="history-toggle" id="history-toggle" type="button"
    aria-controls="history-panel" aria-expanded="false"
    aria-label="展开对话记录" title="展开对话记录">‹</button>

  <!-- hidden 表示默认隐藏；收起时保留内部消息。 -->
  <aside class="history-panel" id="history-panel" aria-label="对话记录面板" hidden>
    <h2>对话记录</h2>
    <!-- 清除本地会话编号，下次模型消息创建新会话；不删除 Dify 云端记录。 -->
    <button type="button" class="new-conversation" id="new-conversation">开始新对话</button>
    <div class="conversation" id="conversation" role="log" aria-live="polite"
      aria-label="对话记录" tabindex="0"></div>
    <p class="hint">刷新后可继续同一段模型会话；历史消息暂不自动恢复。</p>
  </aside>
</body>
</html>
